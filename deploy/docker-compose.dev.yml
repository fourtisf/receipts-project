# Local development services: Postgres, Redis and an anvil fork of Robinhood Chain.
# docker compose -f deploy/docker-compose.dev.yml up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: receipts
      POSTGRES_PASSWORD: receipts
      POSTGRES_DB: receipts
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ['6379:6379']

  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    entrypoint: ['anvil']
    command:
      [
        '--host',
        '0.0.0.0',
        '--fork-url',
        '${RPC_URL:-https://robinhood.drpc.org}',
        '--chain-id',
        '4663',
        '--block-time',
        '2',
      ]
    ports: ['8545:8545']

volumes:
  pgdata:
