# /etc/nginx/sites-available/receipts  — replace receipts.example with APP_DOMAIN
# After first deploy: sudo certbot --nginx -d receipts.example -d www.receipts.example

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream receipts_web { server 127.0.0.1:3000; keepalive 32; }
upstream receipts_api { server 127.0.0.1:4000; keepalive 32; }

server {
    listen 80;
    server_name receipts.example www.receipts.example;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://receipts.example$request_uri; }
}

server {
    listen 443 ssl http2;
    server_name receipts.example;

    # certbot fills these in
    # ssl_certificate     /etc/letsencrypt/live/receipts.example/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/receipts.example/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    client_max_body_size 1m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # WebSocket
    location /api/ws {
        proxy_pass http://receipts_api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # API (strip /api prefix)
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://receipts_api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js static assets
    location /_next/static/ {
        proxy_pass http://receipts_web;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://receipts_web;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
