[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
cbor_metadata = true
fs_permissions = [{ access = "read", path = "../../config" }, { access = "read-write", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]
gas_reports = ["SignalRegistry", "ReceiptsVault", "VaultFactory"]

[profile.default.fuzz]
runs = 512
seed = "0x52454345495054"

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

[profile.ci.fuzz]
runs = 2048

[profile.ci.invariant]
runs = 256
depth = 100

# Coverage needs the legacy pipeline for accurate line mapping.
[profile.coverage]
via_ir = false
optimizer = false

[rpc_endpoints]
robinhood = "${RPC_URL}"

[etherscan]
robinhood = { key = "blockscout", url = "https://robinhoodchain.blockscout.com/api/", chain = 4663 }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
